<app-sidenavbar></app-sidenavbar>
<app-loader *ngIf="isLoading"></app-loader>
<div class="dashboard-content">
  <div class="header-section w-100 d-flex justify-content-between align-items-center">
    <div>
      <h2>Fine Management</h2>
      <h4>View total fines, collected and pending fine.</h4>
    </div>
  </div>

  <div class="grid-section d-flex justify-content-start m-0">
    <div class="grid-options d-flex bg-white">
      <div class="w-25 m-2 box-svgs">
        <svg class="total-fine-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 512">
          <path
            d="M0 64C0 46.3 14.3 32 32 32l264 0c13.3 0 24 10.7 24 24s-10.7 24-24 24l-76.7 0c17.7 19.8 30.1 44.6 34.7 72l42 0c13.3 0 24 10.7 24 24s-10.7 24-24 24l-42 0c-10.4 62.2-60.8 110.9-123.8 118.9L274.6 422c14.4 10.3 17.7 30.3 7.4 44.6s-30.3 17.7-44.6 7.4L13.4 314C2.1 306-2.7 291.5 1.5 278.2S18.1 256 32 256l80 0c35.8 0 66.1-23.5 76.3-56L24 200c-13.3 0-24-10.7-24-24s10.7-24 24-24l164.3 0c-10.2-32.5-40.5-56-76.3-56L32 96C14.3 96 0 81.7 0 64z" />
        </svg>
      </div>
      <div class="w-75">
        <div class="m-3 p-2 mb-0 pb-0">
          <span class="fs-7 fw-bolder">Total Fine</span>
        </div>
        <div class="m-3 p-2 pt-0 mt-0">
          <span class="fs-6 fw-normal">{{totalFine | currency:'INR'}}</span> <br>
        </div>
      </div>
    </div>
    <div class="grid-options d-flex bg-white">
      <div class="w-25 m-2 box-svgs">
        <svg class="collected-fine-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 576 512">
          <path
            d="M288-16c-13.3 0-24 10.7-24 24l0 12-1.8 0c-36.6 0-66.2 29.7-66.2 66.2 0 33.4 24.9 61.6 58 65.7l61 7.6c5.1 .6 9 5 9 10.2 0 5.7-4.6 10.2-10.2 10.2L240 180c-15.5 0-28 12.5-28 28s12.5 28 28 28l24 0 0 12c0 13.3 10.7 24 24 24s24-10.7 24-24l0-12 1.8 0c36.6 0 66.2-29.7 66.2-66.2 0-33.4-24.9-61.6-58-65.7l-61-7.6c-5.1-.6-9-5-9-10.2 0-5.7 4.6-10.2 10.2-10.2L328 76c15.5 0 28-12.5 28-28s-12.5-28-28-28l-16 0 0-12c0-13.3-10.7-24-24-24zM109.3 341.5L66.7 384 32 384c-17.7 0-32 14.3-32 32l0 64c0 17.7 14.3 32 32 32l320.5 0c29 0 57.3-9.3 80.7-26.5l126.6-93.3c17.8-13.1 21.6-38.1 8.5-55.9s-38.1-21.6-55.9-8.5L392.6 416 280 416c-13.3 0-24-10.7-24-24s10.7-24 24-24l72 0c17.7 0 32-14.3 32-32s-14.3-32-32-32l-152.2 0c-33.9 0-66.5 13.5-90.5 37.5z" />
        </svg>
      </div>
      <div class="w-75">
        <div class="m-3 p-2 mb-0 pb-0">
          <span class="fs-7 fw-bolder">Collected Fine</span>
        </div>
        <div class="m-3 p-2 pt-0 mt-0">
          <span class="fs-6 fw-normal">{{collectedFine | currency:'INR'}}</span> <br>
        </div>
      </div>
    </div>
    <div class="grid-options d-flex bg-white">
      <div class="w-25 m-2 box-svgs">
        <svg class="pending-fine-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 384 512">
          <path
            d="M32 0C14.3 0 0 14.3 0 32S14.3 64 32 64l0 11c0 42.4 16.9 83.1 46.9 113.1l67.9 67.9-67.9 67.9C48.9 353.9 32 394.6 32 437l0 11c-17.7 0-32 14.3-32 32s14.3 32 32 32l320 0c17.7 0 32-14.3 32-32s-14.3-32-32-32l0-11c0-42.4-16.9-83.1-46.9-113.1l-67.9-67.9 67.9-67.9c30-30 46.9-70.7 46.9-113.1l0-11c17.7 0 32-14.3 32-32S369.7 0 352 0L32 0zM96 75l0-11 192 0 0 11c0 19-5.6 37.4-16 53L112 128c-10.3-15.6-16-34-16-53zm16 309c3.5-5.3 7.6-10.3 12.1-14.9l67.9-67.9 67.9 67.9c4.6 4.6 8.6 9.6 12.2 14.9L112 384z" />
        </svg>
      </div>
      <div class="w-75">
        <div class="m-2 p-2 mb-0 pb-0 mt-3">
          <span class="fs-7 fw-bolder">Pending fine</span>
        </div>
        <div class="m-3 pt-0 mt-0">
          <span class="fs-6 fw-normal">{{pendingFine | currency:'INR'}}</span> <br>
        </div>
      </div>
    </div>
  </div>

  <div class="w-100">
    <mat-card appearance="outlined" class="rounded-3">
      <mat-card-content>
        <div class="table-container">
          <div class="table">
            <app-table [data]="issuedBooksDataSource" (onDetails)="goToDetails($event)"
              [columns]="issuedBookDataColumns"></app-table>
          </div>
        </div>
      </mat-card-content>
    </mat-card>
  </div>
</div>
