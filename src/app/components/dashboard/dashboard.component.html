<app-sidenavbar></app-sidenavbar>
<div [formGroup]="options" class="w-auto">
  <div class="dashboard-content">
    <div class="header-section w-100 pt-3 px-3">
      <h2 class="mb-0 mt-1">Hello, {{loginService.userName}}</h2>
      <h4 class="font">Explore and enjoy your digital library!</h4>
    </div>
    <div class="grid-section d-flex justify-content-evenly m-0">
      <div class="grid-options d-flex bg-white" routerLink="/student-list">
        <div class="w-50">
          <div class="m-3 p-2 mb-0 mt-4 pb-0">
            <span class="font fs-7 fw-normal">Students</span>
          </div>
          <div class="m-3 p-2 pt-0 mt-0">
            <span class="font fs-5 fw-normal">{{studentCount}}</span>
          </div>
        </div>
        <div class="w-50 m-2 pt-1">
          <img
            src="../../../assets/images/student.jpg"
            alt="student icon"
            class="grid-image"
          />
        </div>
      </div>
      <div class="grid-options d-flex bg-white" routerLink="/teacher-list">
        <div class="w-50">
          <div class="m-3 p-2 mb-0 mt-4 pb-0">
            <span class="font fs-7 fw-normal">Teachers</span>
          </div>
          <div class="m-3 p-2 pt-0 mt-0">
            <span class="font fs-5 fw-normal">{{teacherCount}}</span>
          </div>
        </div>
        <div class="w-50 m-2 pt-1">
          <img
            src="../../../assets/images/teacher.jpg"
            alt="Teacher icon"
            class="grid-image"
          />
        </div>
      </div>
      <div class="grid-options d-flex bg-white" routerLink="/book-list">
        <div class="w-50">
          <div class="m-3 p-2 mb-0 mt-4 pb-0">
            <span class="font fs-7 fw-normal">Books</span>
          </div>
          <div class="m-3 p-2 pt-0 mt-0">
            <span class="font fs-5 fw-normal">{{booksCount}}</span>
          </div>
        </div>
        <div class="w-50 m-2 pt-1">
          <img
            src="../../../assets/images/books.png"
            alt="book icon"
            class="grid-image"
          />
        </div>
      </div>
      <div class="grid-options d-flex bg-white" routerLink="/issue-book-history">
        <div class="w-50">
          <div class="m-1 p-2 mb-0 mt-4 pb-0">
            <span class="font fs-7 fw-normal">Issued Books</span>
          </div>
          <div class="m-3 p-2 pt-0 mt-0">
            <span class="font fs-5 fw-normal">{{issuedBooksCount}}</span>
          </div>
        </div>
        <div class="w-50 m-2 pt-1">
          <img
            src="../../../assets/images/available_books.png"
            alt="book icon"
            class="grid-image"
          />
        </div>
      </div>
    </div>
    <div class="d-flex w-100 pb-2">
      <div class="list-section w-50">
        <div class="mx-1 px-2 pt-3 w-100">
          <mat-card appearance="outlined" class="rounded-3">
            <mat-card-content>
              <div class="d-flex justify-content-between">
                <div class="header-section pt-0 px-0">
                  <div class="d-flex justify-content-center align-items-center">
                    <h4 class="fs-6 fw-bold mx-2">Books</h4>
                  </div>
                </div>
                <div class="header-section pt-0 px-0">
                  <mat-icon>more_vert</mat-icon>
                </div>
              </div>
              <app-table
                [data]="bookDataSource"
                [columns]="BookDataColumns"
              ></app-table>
            </mat-card-content>
          </mat-card>
        </div>
      </div>
      <div class="list-section w-50">
        <div class="mx-1 px-1 pt-3">
          <mat-card appearance="outlined" class="rounded-3">
            <mat-card-content>
              <div class="d-flex justify-content-between">
                <div class="header-section pt-0 px-0">
                  <h4 class="fs-6 fw-bold">Student Names</h4>
                </div>
                <div class="header-section pt-0 px-0">
                  <mat-icon>more_vert</mat-icon>
                </div>
              </div>
              <app-table
                [data]="studentDataSource"
                [columns]="studentDataColumns"
              ></app-table>
            </mat-card-content>
          </mat-card>
        </div>
      </div>
    </div>
    <div class="d-flex w-100 pb-2">
      <div class="list-section w-100">
        <div class="mx-1 px-2 pt-3 w-100">
          <mat-card appearance="outlined" class="rounded-3">
            <mat-card-content>
              <div class="d-flex justify-content-between">
                <div class="header-section pt-0 px-0">
                  <div class="d-flex justify-content-center align-items-center">
                    <h4 class="fs-6 fw-bold mx-2">Issued Books</h4>
                  </div>
                </div>
                <div class="header-section pt-0 px-0">
                  <mat-icon>more_vert</mat-icon>
                </div>
              </div>
              <app-table
                [data]="issuedBookDataSource"
                [columns]="issuedBooksDataColumns"
              ></app-table>
            </mat-card-content>
          </mat-card>
        </div>
      </div>
    </div>
  </div>
</div>
