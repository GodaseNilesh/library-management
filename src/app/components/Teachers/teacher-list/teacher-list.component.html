<app-sidenavbar></app-sidenavbar>
<app-loader *ngIf="isLoading"></app-loader>

<div class="w-auto">
  <div class="dashboard-content">
    <div class="d-flex gap-3">
      <div class="header-section w-100">
        <h4 class="font p-1 fs-6 fw-bolder">Teachers List</h4>
      </div>
      <!-- <div class="d-flex justify-content-center align-items-center">
        <button mat-raised-button color="primary" class="exportBtn" [matMenuTriggerFor]="importOptions" type="button"
          (click)="showImportOptions = !showImportOptions">
          <span class="fs-6">Import</span></button>
        <mat-menu #importOptions="matMenu">
          <button mat-menu-item value="excel" (click)="onImportExportOptionChange('import', 'excel')">Excel</button>
          <button mat-menu-item value="pdf" disabled (click)="onImportExportOptionChange('import', 'pdf')">PDF</button>
        </mat-menu>
      </div> -->
      <div class="d-flex justify-content-center align-items-center">
        <button mat-raised-button color="primary" class="exportBtn" type="button" [matMenuTriggerFor]="exportOptions"
          (click)="showExportOptions = !showExportOptions">
          <mat-icon>save_alt</mat-icon><span class="fs-6">Export</span></button>
        <mat-menu #exportOptions="matMenu">
          <button mat-menu-item value="excel" (click)="onImportExportOptionChange('export', 'excel')">Excel</button>
          <button mat-menu-item value="pdf" disabled (click)="onImportExportOptionChange('export', 'pdf')">PDF</button>
        </mat-menu>
      </div>
    </div>
    <div class="w-100">
      <mat-card appearance="outlined">
        <mat-card-content>
          <div class="d-flex justify-content-end">
            <div class="header-section pt-0 px-0 col-md-4"  >
              <mat-form-field class="example-full-width p-1 w-100"  >
                <input type="email" (keyup)="quickFilter($event)" matInput placeholder="Ex. pat@example.com" />
              </mat-form-field>
            </div>
            <!-- <div class="header-section p-1 col-md-1" >
              <button mat-raised-button color="primary" class="w-100" type="button">Search</button>
            </div> -->
            <div class="header-section p-1">
              <button mat-raised-button color="primary" class="w-25" type="button" routerLink="create-teacher"> <span class="fs-3">+</span></button>
            </div>
          </div>
          <div>
            <app-table
            [data]="teacherDataSource"
            [columns]="teacherDataColumns"
            [pageSize]="10"
            (onEdit)="onEditClicked($event)"
            (onDelete)="onDeleteClicked($event)"
            (onDetails)="onDetailsClicked($event)"
            ></app-table>
          </div>
        </mat-card-content>
      </mat-card>
    </div>
  </div>
</div>
