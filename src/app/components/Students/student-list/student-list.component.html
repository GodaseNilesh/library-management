<app-sidenavbar></app-sidenavbar>
<app-loader *ngIf="isLoading"></app-loader>
<div class="w-auto">
  <div class="dashboard-content">
    <div class="d-flex gap-3">
      <div class="header-section w-100">
        <h4 class="font fs-6 fw-bolder m-0">Student List</h4>
        <div class="breadcrumb-container">
          <span class="breadcrumb-item">
            Dashboard
          </span>
          <span class="separator">
            /
          </span>
          <span class="breadcrumb-active">
            Student List
          </span>
        </div>
      </div>
      <div class="d-flex justify-content-center align-items-center">
        <button mat-raised-button class="exportBtn" type="button" [matMenuTriggerFor]="exportOptions"
          (click)="showExportOptions = !showExportOptions">
          <mat-icon>save_alt</mat-icon><span class="fs-6">Export</span></button>
        <mat-menu #exportOptions="matMenu">
          <button mat-menu-item value="excel" (click)="onImportExportOptionChange('export', 'excel')">Excel</button>
          <button mat-menu-item value="pdf" disabled (click)="onImportExportOptionChange('export', 'pdf')">PDF</button>
        </mat-menu>
      </div>
    </div>
    <div class="w-100">
      <mat-card appearance="outlined">
        <mat-card-content>
          <div class="d-flex justify-content-between">
            <div class="header-section pt-0 px-0 col-md-4 d-flex w-50">
              <mat-form-field class="example-full-width p-1 w-100">
                <input type="email" (keyup)="quickFilter($event)" matInput placeholder="Search students..." />
              </mat-form-field>
              <mat-icon class="search-icon">search</mat-icon>
            </div>
            <div class="header-section p-1">
              <button mat-raised-button type="button" class="add-student-btn" routerLink="create-student"> <span class="fs-6">+ Add Student</span></button>
            </div>
          </div>
          <div>
            <app-table
            [data]="studentsDataSource"
            [columns]="StudentDataColumns"
            [pageSize]="10"
            (onEdit)="onEditClicked($event)"
            (onDetails)="onDetailsClicked($event)"
            (onDelete)="onDeleteClicked($event)"
            ></app-table>
          </div>
        </mat-card-content>
      </mat-card>
    </div>
  </div>
</div>
