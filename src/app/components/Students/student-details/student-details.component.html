<app-sidenavbar></app-sidenavbar>
<app-loader *ngIf="isLoading"></app-loader>
<div class="w-auto">
  <div class="dashboard-content">
    <div class="d-flex justify-content-start">
      <div class="header-section mx-1">
        <h4 class="fs-6 fw-bolder">
          <mat-icon
            class="fs-6 mt-2 custom-tooltip"
            matTooltip="Back"
            matTooltipClass="my-tooltip"
            matTooltipPosition="above"
            routerLink="/student-list"
          >
            arrow_back_ios
          </mat-icon>
        </h4>
      </div>
      <div class="header-section">
        <h4 class="p-1 fs-6 fw-bolder">Student Details</h4>
      </div>
    </div>
    <div class="w-100">
      <div class="details-container d-flex justify-content-between">
        <mat-card appearance="outlined" class="personal-details w-100">
          <h4 class="fs-5 m-3 mb-1">Personal Details :</h4>
          <form [formGroup]="studentDetailsForm">
            <mat-card-content class="d-flex flex-wrap gap-4">
              <div class="flex-item">
                <span class="d-flex align-items-center">
                  <i class="fa-regular fa-user mx-1 px-1"></i>
                  <span class="mx-1 fw-bold">Student Name:</span>
                </span>
                <input type="text" formControlName="fullName" class="w-100 border-0 lh-1" readonly />
              </div>

              <div class="flex-item">
                <span class="d-flex align-items-center">
                  <i class="fa-solid fa-chalkboard-user px-1"></i>
                  <span class="mx-1 fw-bold">Class Name:</span>
                </span>
                <input type="text" formControlName="className" class="w-100 border-0 lh-1" readonly />
              </div>

              <div class="flex-item">
                <span class="d-flex align-items-center">
                  <i class="fa-solid fa-building-user px-1"></i>
                  <span class="mx-1 fw-bold">Department Name:</span>
                </span>
                <input type="text" formControlName="department" class="w-100 border-0 lh-1" readonly />
              </div>

              <div class="flex-item">
                <span class="d-flex align-items-center">
                  <i class="fa-solid fa-mobile-screen-button px-1"></i>
                  <span class="mx-1 fw-bold">Mobile No.:</span>
                </span>
                <input type="text" formControlName="mobileNo" class="w-100 border-0 lh-1" readonly style="margin-left: 20px;"/>
              </div>

              <div class="flex-item">
                <span class="d-flex align-items-center">
                  <i class="fa-regular fa-id-card px-1"></i>
                  <span class="mx-1 fw-bold">Roll No:</span>
                </span>
                <input type="text" formControlName="rollNo" class="w-100 border-0 lh-1" readonly style="margin-left: 28px;"/>
              </div>

              <div class="flex-item email-item">
                <span class="d-flex align-items-center">
                  <i class="fa-regular fa-envelope px-1"></i>
                  <span class="mx-1 fw-bold">Email:</span>
                </span>
                <input type="text" formControlName="email" class="w-100 border-0 lh-1" readonly style="margin-left: 25px;"/>
              </div>

              <div class="d-flex gap-3">
                <button mat-raised-button class="px-3" type="button" routerLink="/student-list">
                  <span>Back</span>
                </button>

                <button mat-raised-button color="primary" class="px-3 add-student-btn" type="button" (click)="goToEditPage()">
                  <span>Edit Student</span>
                </button>

                <button mat-raised-button color="primary" class="px-3 add-student-btn" type="button" *ngIf="payFineBtnVisiable">
                  <span>Pay Fine</span>
                </button>
              </div>
            </mat-card-content>
          </form>
        </mat-card>
        <mat-card appearance="outlined" class="book-details">
          <mat-card-content>
            <div>
              <app-table [data]="issuedBookDatasource" [columns]="StudentDataColumns" [pageSize]="10">
              </app-table>
            </div>
          </mat-card-content>
        </mat-card>
      </div>
    </div>
  </div>
</div>
