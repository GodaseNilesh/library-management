<mat-toolbar class="example-header" *ngIf="authService.isUserLoggedIn">
  <div class="d-flex w-100 justify-content-between align-items-center h-100">
    <div class="d-flex justify-content-center align-items-center">
      <div>
        <h2 class="text-light font">Online Library</h2>
      </div>
      <div class="mt-2 px-2">
        <!-- <span><mat-icon class="px-1 w-100 menu-icon">menu</mat-icon> </span> -->
        <span><mat-icon class="px-1 w-100 menu-icon">local_library</mat-icon> </span>
      </div>
    </div>
    <div class="d-flex justify-content-center align-items-center h-100">
      <div class="user-icon mx-2">
        <img
          src="../assets/images/admin-icon.jpg"
          class="user-image"
          alt=""
        />
      </div>
      <div class="m-0">
        <div>
          <span class="d-flex align-items-end"
            ><h5 class="fs-6 m-0 font text-light">Hello, Admin</h5></span
          >
        </div>
        <div class="d-flex bg-info">
          <select name="user-action" id="user-action" class="m-0 user-action text-light" (change)="onActionChange($event)">
            <option value="administrator">Administrator</option>
            <option value="profile">Profile</option>
            <option value="logout">Logout</option>
          </select>
        </div>
      </div>
    </div>
  </div>
</mat-toolbar>
<router-outlet></router-outlet>
